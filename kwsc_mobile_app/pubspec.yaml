name: kwsc_mobile_app
description: KW&SC One Window Facility & HRMS Mobile App.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Styling
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Backend & State Management
  supabase_flutter: ^2.3.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/kwsc-logo.png
